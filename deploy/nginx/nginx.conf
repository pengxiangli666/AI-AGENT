worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Docker's embedded DNS: lets us resolve app containers by name at request time,
    # so nginx starts fine with zero apps and survives apps coming and going.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Unknown host -> 404 (never proxy to something unexpected)
    server {
        listen 80 default_server;
        server_name _;
        return 404;
    }

    # One generated file per deployed app (see sandbox/faas.py)
    include /etc/nginx/conf.d/*.conf;
}
